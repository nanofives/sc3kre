<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sc3font test</title>
<!-- sc3ui3 (round 2026-11-19b): standalone test of sc3font.js. Local only: it reads the game's FBF fonts from the
     install named in ?game=<file URL of the folder that holds Apps> (test hook) and draws known strings with them.
     re/tools/bldimport/webtest/sc3font_check.py screenshots it and compares every string with re/tools/sc3ui/fbf.py's
     own rendering of the same string, pixel for pixel. Without ?game the page shows the free fonts (the fallback). -->
<link rel="stylesheet" href="../../../docs/assets/sc3ui.css">
<style>
:root { --ui-scale: 1; }
html, body { margin: 0; background: #fff; color: #000; }
/* plain page text, no layer tricks: what the importer's own text gets */
#samples { position: absolute; left: 0; top: 0; width: 900px; height: 520px; }
#samples div { position: absolute; left: 10px; white-space: pre; color: #000; }
#tokens { position: absolute; left: 0; top: 540px; padding: 4px 10px; }
#result { position: absolute; left: 0; top: 640px; font: 12px monospace; white-space: pre-wrap; }
</style>
<script src="sc3font.js"></script>
</head>
<body>
<div id="samples"></div>
<div id="tokens">
  <span id="t_ui" style="font: var(--ui-type-ui)">Efectos sonido</span>
  <span id="t_row" style="font: var(--ui-type-row)">800x600 NVIDIA</span>
  <span id="t_title" style="font: var(--ui-type-title)">Preferencias</span>
</div>
<pre id="result">pending</pre>
<script>
// one row per (font, string), 36 px apart; each row's line box is exactly the font's line, so the glyph cells start
// at the row's top like the game's (sc3font_check.py reads the same table back from #result)
const SAMPLES = [
  ['MAIN9', 'Efectos sonido Tráfico visible 3 Aumentos'],
  ['MAIN9', 'Pob: 794,278 2/9/2067 Música áéíóúñ¿¡'],
  ['MAIN10', "Camiones O'Plenty Industrial"],
  ['SYSTEM9', '800x600 NVIDIA GeForce RTX 1280x1024'],
  ['SYSTEM9', 'Ordenanzas Tratos con vecinos Préstamos'],
  ['TITLE9', 'Sustituir Gastos Ingresos Aceptar'],
  ['TITLE12', 'Preferencias Indagar Presupuesto'],
  ['SERIF17', 'Nueva Ciudad Cargar Ciudad'],
  ['MAIN9', 'Navy on lavender like the game', '#31347b'],
];
// gamefont (round 2026-11-19d): ?published=1 draws the same strings with the published web fonts of sc3ui.css
// (docs/assets/fonts/*.woff2, built by re/tools/sc3ui/build_fonts.mjs) at their token sizes: family, CSS px, line px
// (SC3 Main: 16, its ascent / descent overrides in sc3ui.css make a 16 px line box with the cell at the top)
const PUB = { MAIN9: ['SC3 Main', 12.5, 16], MAIN10: ['SC3 Name', 13.5, 16], SYSTEM9: ['SC3 System', 11.5, 14],
  TITLE9: ['SC3 Button', 11, 18], TITLE12: ['SC3 Title', 16, 23], SERIF17: ['SC3 Serif', 16, 29] };
async function published(out) {
  const box = document.getElementById('samples');
  out.fonts = {};
  for (const [nm, [fam, size]] of Object.entries(PUB)) {
    let faces = [];
    try { faces = await document.fonts.load(`400 ${size}px "${fam}"`, 'Aa'); } catch (e) { /* missing file */ }
    out.fonts[nm] = { family: fam, status: faces.length && faces.every(f => f.status === 'loaded') ? 'loaded' : 'error' };
  }
  SAMPLES.forEach(([nm, text, col], i) => {
    const [fam, size, line] = PUB[nm];
    const d = document.createElement('div');
    d.style.top = (10 + i * 36) + 'px';
    d.style.font = `400 ${size}px/${line}px "${fam}"`;
    if (col) d.style.color = col;
    d.textContent = text; box.appendChild(d);
    out.samples.push({ font: nm, text, x: 10, y: 10 + i * 36, color: col || '#000000' });
  });
  await document.fonts.ready;
  out.tokens = Object.fromEntries(['t_ui', 't_row', 't_title'].map(id => [id, getComputedStyle(document.getElementById(id)).fontFamily]));
  { const pr = document.createElement('div'); pr.style.cssText = 'position:absolute;width:calc(100 * var(--u));height:1px'; document.body.appendChild(pr); out.u = (pr.getBoundingClientRect().width / 100) + 'px'; pr.remove(); }
  out.lang = 'ENGLISH'; out.ok = true; out.published = true;
  document.getElementById('result').textContent = JSON.stringify(out);
}
(async () => {
  const q = new URLSearchParams(location.search), out = { samples: [], ok: false };
  if (q.get('published') === '1') return published(out);
  const game = q.get('game');
  if (!game) {   // no game folder: the page keeps sc3ui.css's fonts (the published game fonts, free fonts behind them)
    const used = await SC3Font.useGame(null);
    document.getElementById('result').textContent = JSON.stringify({ fallback: true, used: !!used, family: getComputedStyle(document.getElementById('t_ui')).fontFamily });
    return;
  }
  const info = await SC3Font.useGame(game, { mode: q.get('mode') || 'snap', force: true });
  if (!info) { document.getElementById('result').textContent = JSON.stringify({ error: 'no fonts' }); return; }
  out.lang = info.lang;
  const cal = await SC3Font.calibrate(); out.calibration = cal.got ? cal.got.map(v => +v.toFixed(3)) : cal.why;
  out.fonts = Object.fromEntries(Object.entries(info.fonts).map(([k, f]) => [k, { line: f.line, base: f.base, glyphs: f.glyphs, status: f.face.status }]));
  const box = document.getElementById('samples');
  SAMPLES.forEach(([nm, text, col], i) => {
    const f = info.fonts[nm]; if (!f) return;
    const d = document.createElement('div');
    d.style.top = (10 + i * 36) + 'px';
    d.style.font = `400 16px/${f.line}px "${f.family}"`;
    if (col) d.style.color = col;
    d.textContent = text; box.appendChild(d);
    out.samples.push({ font: nm, text, x: 10, y: 10 + i * 36, color: col || '#000000' });
  });
  await document.fonts.ready;
  out.tokens = Object.fromEntries(['t_ui', 't_row', 't_title'].map(id => [id, getComputedStyle(document.getElementById(id)).fontFamily]));
  out.gpx = getComputedStyle(document.documentElement).getPropertyValue('--ui-gpx').trim();
  out.ok = true;
  document.getElementById('result').textContent = JSON.stringify(out);
})();
</script>
</body>
</html>
