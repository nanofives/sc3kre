<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preferencias replica</title>
<!-- sc3ui2 (round 2026-11-18g): the game's Preferencias dialog rebuilt with docs/assets/sc3ui.css at --ui-scale 1,
     to be diffed against a native 800x600 grab (re/tools/sc3ui/replica_diff.py). The dialog's own layout (where each
     group box sits) is placed by hand from the measured rectangles; everything inside a box (bevels, fonts, row
     pitch, padding, control sizes) comes from sc3ui.css.
     sc3ui3 (round 2026-11-19b): the close X, play / stop, the dropdown arrow, the sliders and the volume steps are the
     game's bitmaps from docs/assets/sc3ui/ (owner call). ?gamefont=1 loads the game's own FBF fonts at run time with
     re/tools/bldimport/sc3font.js from the folder in ?game=<file URL of the install> (test hook, local only). -->
<link rel="stylesheet" href="../../../docs/assets/sc3ui.css">
<script src="../bldimport/sc3font.js"></script>
<script>
// test hook (local only): ?gamefont=1&game=<file URL of the install> draws the replica's text with the game's own fonts
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get('gamefont') === '1' && q.get('game')) SC3Font.useGame(q.get('game')).then(i => { document.documentElement.dataset.fontReady = i ? 'game' : 'free'; });
})();
</script>
<style>
:root { --ui-scale: 1; }
html, body { margin: 0; background: #000; }
#dlg { position: relative; width: 480px; height: 472px; }
#dlg > .ui-group, #dlg > .ui-plate, #dlg > .ui-strip, #dlg > .ui-list, #dlg > .sbtn, #dlg > .abs { position: absolute; margin: 0; }
.ind { padding-left: 4px; }
/* sc3ui3: the stylesheet's line flow puts the combo 1 px under the game's (heading line box 18 px, the game's 17) */
.ind > select { margin-top: -1px; }
.rows24 > .ui-opt { min-height: 24px; }
.tight { padding-top: 0; }
/* gamefont: the bottom group pitch is 17 px; with the game font a 16 px line keeps its MAIN9 cell where the game has it */
.tight .ui-opt { min-height: 17px; line-height: 16px; align-items: flex-start; }
.tight .ui-opt > input { margin-top: 2px; }
.ui-plate.panel { padding: 0; display: block; }
.ui-plate.panel .ui-volume { position: absolute; left: 13px; top: 3px; }
.ui-plate.panel input[type=range] { position: absolute; left: 5px; width: 86px; }
/* the list's scroll bar: a real scrolling box drawn by sc3ui.css's ::-webkit-scrollbar rules. Chrome draws the thumb at least 17 px long (the game: 16). 797 px of content in
   130 px gives a 16 px thumb at the top, as in the game (track 98 px x 130 / 797) */
/* 10 px of (transparent) content to its left: Chrome draws no thumb in a box whose content is 0 px wide */
.scroller { position: absolute; left: 442px; top: 177px; width: 26px; height: 130px; overflow-y: scroll; }
.scroller > div { height: 797px; }
.sbtn { position: absolute; width: 14px; height: 14px; min-height: 0; padding: 0; border-radius: 2px; margin: 0; font-size: 7px; letter-spacing: 0; }
#dlg > .ui-play, #dlg > .ui-stop { position: absolute; top: 312px; }
#dlg > .ui-ok { position: absolute; left: 431px; top: 433px; }
</style>
</head>
<body>
<div class="ui-window" id="dlg">
  <div class="ui-titlebar">Preferencias<button class="ui-close" aria-label="Cerrar">&#x2715;</button></div>

  <div class="ui-group" style="left:5px;top:41px;width:200px;height:300px">
    <span class="ui-label">Efectos sonido</span>
    <span class="ui-label">Tr&aacute;fico visible</span>
    <div class="ind">
      <label class="ui-opt"><input type="radio" name="t" checked>3 Aumentos</label>
      <label class="ui-opt"><input type="radio" name="t">2 Aumentos</label>
      <label class="ui-opt"><input type="radio" name="t">1 Aumentos</label>
      <label class="ui-opt"><input type="radio" name="t">Desactivados</label>
    </div>
    <span class="ui-label">Sims visibles</span>
    <div class="ind">
      <label class="ui-opt"><input type="radio" name="s" checked>2 Aumentos</label>
      <label class="ui-opt"><input type="radio" name="s">1 Aumentos</label>
      <label class="ui-opt"><input type="radio" name="s">Desactivados</label>
    </div>
    <span class="ui-label">Otras animaciones</span>
    <div class="ind">
      <label class="ui-opt"><input type="radio" name="o" checked>Activados</label>
      <label class="ui-opt"><input type="radio" name="o">Desactivados</label>
    </div>
    <span class="ui-label">Resoluci&oacute;n de pantalla</span>
    <div class="ind"><select style="width:176px"><option>800x600 NVIDIA GeForce RTX</option></select></div>
  </div>

  <div class="ui-group" style="left:211px;top:41px;width:262px;height:300px">
    <span class="ui-label">Sonido</span>
    <div style="padding-left:2px" class="rows24">
      <label class="ui-opt"><input type="checkbox" checked>M&uacute;sica</label>
      <label class="ui-opt"><input type="checkbox" checked>Sonido Ambiente</label>
      <label class="ui-opt"><input type="checkbox" checked>Efectos sonido</label>
      <label class="ui-opt"><input type="checkbox">Activar sonidos 3D</label>
    </div>
    <span class="ui-label" style="margin-top:0">M&uacute;sicas posibles</span>
  </div>
  <div class="ui-plate panel" style="left:371px;top:45px;width:96px;height:110px">
    <span class="ui-volume"></span>
    <input type="range" value="100" style="top:20px"><input type="range" value="100" style="top:44px"><input type="range" value="100" style="top:68px">
  </div>
  <div class="ui-list" style="left:217px;top:177px;width:234px;height:130px">
    <label><input type="checkbox" checked>Updown Town</label>
    <label><input type="checkbox" checked>Night Life</label>
    <label><input type="checkbox" checked>South Bridge</label>
    <label><input type="checkbox" checked>Central Park Sunday</label>
    <label><input type="checkbox" checked>Building</label>
    <label><input type="checkbox" checked>Magic City</label>
    <label><input type="checkbox" checked>Illumination</label>
  </div>
  <div class="scroller"><div></div></div>
  <div class="ui-strip" style="left:217px;top:309px;width:250px;height:28px">Eschuchar elecci&oacute;n</div>
  <button class="ui-play" style="left:413px" aria-label="Escuchar">&#x25B6;</button><button class="ui-stop" style="left:437px" aria-label="Parar">&#x25A0;</button>

  <div class="ui-group tight" style="left:5px;top:345px;width:468px;height:76px">
    <span class="ui-label">Opciones generales:</span>
    <div class="ind">
      <label class="ui-opt"><input type="checkbox">Ver consejos al iniciar</label>
      <label class="ui-opt"><input type="checkbox" checked>Ir a los desastres autom&aacute;tico</label>
    </div>
  </div>
  <button class="ui-ok" aria-label="Aceptar">&#x2713;</button>
</div>
</body>
</html>
